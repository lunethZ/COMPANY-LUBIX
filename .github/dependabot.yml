version: 2

# Politica de actualizacion: ver Docs/Plan_Actualizaciones_Soporte_Monitoreo_Capacitacion.md §2.6
updates:
  # Backend (pip / requirements.txt)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    groups:
      correcciones:
        update-types: ["patch"]
      mejoras-menores:
        update-types: ["minor"]

  # Web (npm / frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
    groups:
      correcciones:
        update-types: ["patch"]
      mejoras-menores:
        update-types: ["minor"]

  # Movil (npm / mobile)
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(mobile)"
    groups:
      correcciones:
        update-types: ["patch"]
      mejoras-menores:
        update-types: ["minor"]

  # GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"

  # Imagenes de Docker Compose (raiz)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  # Imagenes base de los Dockerfile de cada servicio
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker-backend)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker-web)"

  - package-ecosystem: "docker"
    directory: "/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker-mobile)"
