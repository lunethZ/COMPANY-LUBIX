name: Security scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen local
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          load: true
          push: false
          tags: lubix-${{ matrix.component }}:scan

      - name: Escanear imagen (SARIF, CRITICAL y HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lubix-${{ matrix.component }}:scan
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Bloquear si hay CRITICAL con parche
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lubix-${{ matrix.component }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      # Si el repositorio no tiene Code Scanning habilitado, el escaneo sigue
      # valiendo por el artefacto y el paso anterior.
      - name: Subir resultados a Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.sarif
          if-no-files-found: ignore
