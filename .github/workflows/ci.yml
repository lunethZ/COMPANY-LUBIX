name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Vitest y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps
      - name: Pruebas con cobertura (umbral 40 % en los formularios con pruebas)
        run: npm run test:coverage

  backend:
    name: Backend (pytest y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: >
          pip install -r requirements.txt httpx==0.28.1 pytest pytest-cov
      - name: Pruebas con cobertura (umbral 50 %)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=50
