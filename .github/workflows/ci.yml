name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Vitest y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas con cobertura (80 % global y 40 % por página)
        run: npm run test:coverage
      - name: Verificar compilación de producción
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Flujos E2E de registro, compra y PQRS
        run: npm run test:e2e

  backend:
    name: Backend (pytest y cobertura)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lubix_test
          POSTGRES_PASSWORD: lubix_test
          POSTGRES_DB: lubix_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://lubix_test:lubix_test@localhost:5435/lubix_test
      REPOSITORY_TEST_DATABASE_URL: postgresql+psycopg2://lubix_test:lubix_test@localhost:5435/lubix_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: >
          pip install -r requirements.txt httpx==0.28.1 pytest pytest-cov
      - name: Crear esquema de la BD de pruebas
        run: python scripts/init_test_db.py
      - name: Tests de repositorio contra PostgreSQL real
        run: pytest tests/repositories/ -v --no-cov
      - name: Pruebas con cobertura (umbral 75 %)
        run: pytest --junitxml=test-results.xml
      - name: Verificar las pruebas de integración PostgreSQL
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          modules = {
              "test_fixtures_base",
              "test_postgres_smoke",
              "test_productos_postgres",
              "test_pqrs_postgres",
              "test_registro_postgres",
          }
          cases = {module: [] for module in modules}
          for case in ET.parse("test-results.xml").iter("testcase"):
              parts = case.get("classname", "").split(".")
              if "integration" in parts:
                  for module in modules.intersection(parts):
                      cases[module].append(case)

          for module, tests in cases.items():
              if not tests or any(test.find("skipped") is not None for test in tests):
                  raise SystemExit(f"Las pruebas de {module} faltan o fueron omitidas")
              print(f"{module}: {len(tests)} pruebas ejecutadas")
          PY

  build-images-pr:
    name: Comprobar imagen ${{ matrix.component }} (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir sin publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false

  publish-images:
    name: Publicar imagen ${{ matrix.component }} en GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, e2e, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Acceder a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preparar nombre de imagen
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
