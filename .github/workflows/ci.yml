name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Vitest y cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Pruebas con cobertura (umbral 40 % en los formularios con pruebas)
        run: npm run test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium
      - name: Flujos E2E de registro, compra y PQRS
        run: npm run test:e2e

  backend:
    name: Backend (pytest y cobertura)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lubix_test
          POSTGRES_PASSWORD: lubix_test
          POSTGRES_DB: lubix_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REPOSITORY_TEST_DATABASE_URL: postgresql+psycopg2://lubix_test:lubix_test@localhost:5435/lubix_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: >
          pip install -r requirements.txt httpx==0.28.1 pytest pytest-cov
      - name: Tests de repositorio contra PostgreSQL real
        run: pytest tests/repositories/ -v
      - name: Pruebas con cobertura (umbral 80 %)
        run: pytest
