name: SonarCloud Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lubix_test
          POSTGRES_PASSWORD: lubix_test
          POSTGRES_DB: lubix_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://lubix_test:lubix_test@localhost:5435/lubix_test
      REPOSITORY_TEST_DATABASE_URL: postgresql+psycopg2://lubix_test:lubix_test@localhost:5435/lubix_test

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas y cobertura del frontend
        working-directory: frontend
        run: npm run test:coverage

      - name: Normalizar rutas del LCOV para el monorepo
        run: |
          sed -i -E 's|^SF:(.*/)?frontend/src/|SF:frontend/src/|; s|^SF:(\./)?src/|SF:frontend/src/|' frontend/coverage/lcov.info

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.txt httpx==0.28.1 pytest pytest-cov pytest-mock

      - name: Crear esquema de la BD de pruebas
        working-directory: backend
        run: python scripts/init_test_db.py

      - name: Tests de repositorio contra PostgreSQL real
        working-directory: backend
        run: pytest tests/repositories/ -v --no-cov

      - name: Pruebas y cobertura del backend
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Verificar reportes de cobertura
        run: |
          ls -lh frontend/coverage/lcov.info backend/coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}