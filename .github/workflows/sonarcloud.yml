name: SonarCloud Analysis

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Pruebas y cobertura del frontend
        working-directory: frontend
        run: npm run test:coverage

      - name: Normalizar rutas del LCOV para el monorepo
        run: |
          sed -i -E 's|^SF:(.*/)?frontend/src/|SF:frontend/src/|; s|^SF:(\./)?src/|SF:frontend/src/|' frontend/coverage/lcov.info

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.txt httpx==0.28.1 pytest pytest-cov

      - name: Pruebas y cobertura del backend
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=50

      - name: Verificar reportes de cobertura
        run: |
          ls -lh frontend/coverage/lcov.info backend/coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}