# PostgreSQL desechable SOLO para tests de integración.
# No usa volumen con nombre: `down -v` borra todo.
# `name` separa esta pila de la de desarrollo (docker-compose.yml).
name: lubix-test

services:
  postgres-test:
    image: postgres:16
    environment:
      # Credenciales desechables de una BD local, no de producción.
      POSTGRES_USER: lubix_test
      POSTGRES_PASSWORD: lubix_test
      POSTGRES_DB: lubix_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lubix_test -d lubix_test"]
      interval: 2s
      timeout: 3s
      retries: 15