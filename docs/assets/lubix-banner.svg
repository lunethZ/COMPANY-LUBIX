<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="lubix-banner-title lubix-banner-desc">
  <title id="lubix-banner-title">LUBIX</title>
  <desc id="lubix-banner-desc">Plataforma Integral de Gestión Empresarial</desc>

  <defs>
    <linearGradient id="lubix-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <radialGradient id="lubix-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lubix-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#BFDBFE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <pattern id="lubix-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#93C5FD" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <clipPath id="lubix-clip">
      <rect width="1200" height="300" />
    </clipPath>
  </defs>

  <g clip-path="url(#lubix-clip)">
    <rect width="1200" height="300" fill="url(#lubix-bg)" />
    <rect width="1200" height="300" fill="url(#lubix-grid)" />
    <ellipse cx="600" cy="150" rx="460" ry="230" fill="url(#lubix-glow)" />

    <g fill="none" stroke="#93C5FD" stroke-opacity="0.12" stroke-width="1.5">
      <circle cx="120" cy="66" r="78" />
      <circle cx="120" cy="66" r="52" />
      <circle cx="1080" cy="234" r="78" />
      <circle cx="1080" cy="234" r="52" />
      <path d="M0 246 L 168 108 L 292 190" />
      <path d="M1200 54 L 1032 192 L 908 110" />
      <path d="M-30 300 L 250 20 M 30 320 L 310 40" stroke-opacity="0.07" />
      <path d="M1230 0 L 950 280 M 1170 -20 L 890 260" stroke-opacity="0.07" />
      <path d="M600 16 L 600 42 M 600 258 L 600 284" stroke-opacity="0.2" />
    </g>

    <g fill="#BFDBFE">
      <circle cx="66" cy="214" r="3" fill-opacity="0.35" />
      <circle cx="212" cy="60" r="2" fill-opacity="0.3" />
      <circle cx="296" cy="256" r="2.5" fill-opacity="0.25" />
      <circle cx="934" cy="46" r="2.5" fill-opacity="0.25" />
      <circle cx="1018" cy="242" r="2" fill-opacity="0.3" />
      <circle cx="1134" cy="88" r="3" fill-opacity="0.35" />
      <circle cx="470" cy="34" r="2" fill-opacity="0.25" />
      <circle cx="730" cy="266" r="2" fill-opacity="0.25" />
    </g>

    <g aria-hidden="true">
      <polygon points="600,46 632,64 600,82 568,64" fill="#F8FAFC" fill-opacity="0.96" />
      <polygon points="568,64 600,82 600,118 568,100" fill="#93C5FD" fill-opacity="0.9" />
      <polygon points="632,64 600,82 600,118 632,100" fill="#60A5FA" fill-opacity="0.78" />
      <path d="M600 82 L600 118" stroke="#0F172A" stroke-opacity="0.35" stroke-width="1.5" />
      <path d="M568 64 L600 82 L632 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1" />
    </g>

    <text x="606" y="196" text-anchor="middle" fill="#FFFFFF" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="12">LUBIX</text>
    <text x="600" y="236" text-anchor="middle" fill="#CBD5E1" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="1.5">Plataforma Integral de Gestión Empresarial</text>

    <rect x="430" y="260" width="340" height="2" rx="1" fill="url(#lubix-accent)" />
  </g>
</svg>
