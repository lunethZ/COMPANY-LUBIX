[project]
name = "better-backend"
version = "0.1.0"
description = "Este backend fue creado por yeinher Algarin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.18.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==26.2.0",
    "bcrypt==3.2.2",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.3.1",
    "dnspython==2.8.0",
    "ecdsa>=0.19.2",
    "email-validator==2.3.0",
    "fastapi==0.135.1",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "idna>=3.15",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "minio==7.2.20",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.11",
    "pyasn1==0.6.3",
    "pycparser==3.0",
    "pycryptodome==3.23.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart>=0.0.27",
    "requests==2.33.1",
    "rsa==4.9.1",
    "sentry-sdk==2.54.0",
    "six==1.17.0",
    "sqlalchemy==2.0.48",
    "starlette>=1.0.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3>=2.7.0",
    "uvicorn==0.41.0",
    "uvloop==0.22.1",
    "watchfiles==1.1.1",
    "websockets==16.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    # Suite de tests (TestClient de FastAPI necesita httpx)
    "httpx>=0.27.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
# Estilo del backend: lineas largas en mensajes y queries SQL.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# Errores de pycodestyle y pyflakes: imports sin usar, nombres indefinidos,
# redefiniciones. El resto de reglas queda fuera del gate.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Los modelos usan referencias en cadena ("Users") resueltas por SQLAlchemy.
"app/models/*.py" = ["F821"]
# __init__ reexporta los modelos para registrar los mapeos.
"app/models/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# Correr `pytest` desde `backend/` descubre la suite automáticamente.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
# Script manual de siembra: se ejecuta dentro del contenedor, no lo cubre pytest.
# admin.py es un router legado que main.py nunca monta; sus endpoints viven en AdminRouter.
omit = ["app/utils/seed_demo.py", "app/routers/admin.py"]

[tool.coverage.report]
include_namespace_packages = true
fail_under = 80
show_missing = true
precision = 2
