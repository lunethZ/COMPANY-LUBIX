    "ecdsa>=0.19.2",
    "email-validator==2.3.0",
    "fastapi==0.135.1",
    "greenlet==3.3.2",
    "h11==0.16.0",
    "httptools==0.7.1",
    "idna>=3.15",
    "mako==1.3.12",
    "markupsafe==3.0.3",
