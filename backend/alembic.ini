# Alembic Configuration File

[alembic]
script_location = alembic
# Permite importar el paquete app/ cuando Alembic se ejecuta desde Render o
# desde un entorno virtual (el directorio actual no siempre está en sys.path).
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
