# Identidad del proyecto: copiar EXACTAMENTE de SonarCloud
sonar.projectKey=lunethZ_COMPANY-LUBIX
sonar.organization=lunethZ
sonar.projectName=COMPANY-LUBIX
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Código fuente real del monorepo
sonar.sources=frontend/src,backend/app,mobile/src,mobile/App.tsx

# Pruebas: frontend tiene tests junto al código; backend los tiene en tests/
sonar.tests=frontend/src,backend/tests

# Archivos que no aportan al análisis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/__pycache__/**,**/alembic/versions/**,**/e2e/**,**/src/test/**,**/*.d.ts

# Qué archivos deben tratarse como pruebas
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**/*.py

# Reportes generados por el workflow
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

# Mobile aún no tiene pruebas: que no baje la métrica de cobertura
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/src/test/**,**/e2e/**,**/tests/**,**/*.d.ts,**/main.tsx,**/types/**,mobile/**